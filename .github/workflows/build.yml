
name: Build 087 SparMusic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MusicFree source
        uses: actions/checkout@v4
        with:
          repository: maotoumao/MusicFree
          ref: master
          path: upstream

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream/android/**/*.gradle*

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Rename app to 087 SparMusic
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/res/values/strings.xml")
          if not p.exists():
              raise SystemExit("找不到 Android 应用名称文件")

          s = p.read_text(encoding="utf-8")
          s, n = re.subn(
              r'(<string name="app_name"[^>]*>).*?(</string>)',
              r'\g<1>087 SparMusic\g<2>',
              s,
              count=1
          )
          if n == 0:
              raise SystemExit("未找到 app_name，停止构建以避免名称修改失败")

          p.write_text(s, encoding="utf-8")
          print("应用名称已设置为 087 SparMusic")
          PY

      - name: Install dependencies
        working-directory: upstream
        run: npm ci --no-audit --no-fund

      - name: Download Xiaowo and Xiaoqiu plugins
        shell: bash
        run: |
          set -e
          mkdir -p plugin-pack

          curl -fL --retry 3 \
            "https://fastly.jsdelivr.net/gh/Huibq/keep-alive/Music_Free/xiaowo.js" \
            -o plugin-pack/xiaowo.js

          curl -fL --retry 3 \
            "https://fastly.jsdelivr.net/gh/Huibq/keep-alive/Music_Free/xiaoqiu.js" \
            -o plugin-pack/xiaoqiu.js

          test -s plugin-pack/xiaowo.js
          test -s plugin-pack/xiaoqiu.js

          cat > plugin-pack/README.txt <<'EOF'
          087 SparMusic 音源文件
          小窝：xiaowo.js
          小秋：xiaoqiu.js

          请在 MusicFree 的插件管理页面导入对应 JS 文件。
          插件能否使用取决于音源服务是否可访问。
          EOF

      - name: Build debug APK
        working-directory: upstream/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -s upstream/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh upstream/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 087-SparMusic-APK
          path: upstream/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xiaowo and Xiaoqiu plugins
        uses: actions/upload-artifact@v4
        with:
          name: 087-SparMusic-Plugins
          path: plugin-pack/
          if-no-files-found: error
          retention-days: 14
